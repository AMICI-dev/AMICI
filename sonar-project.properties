# SonarScanner configuration
# https://docs.sonarqube.org/latest/analysis/scan/sonarscanner/
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/
# https://sonarcloud.io/documentation/analysis/languages/cfamily/

sonar.host.url=https://sonarcloud.io
sonar.organization=icb-dcm
sonar.projectKey=ICB-DCM_AMICI

sonar.sources=.
sonar.tests=python/tests
sonar.exclusions=\
  build/**,\
  ThirdParty/**,\
  doc/**,\
  models/**,\
  model_*/**,\
  **/amici_models/**,\
  python/sdist/amici/_installation/CMakeLists.txt,\
  python/sdist/amici/_installation/ThirdParty/**,\
  python/sdist/amici/_installation/cmake/**,\
  python/sdist/amici/_installation/include/**,\
  python/sdist/amici/_installation/src/**,\
  python/sdist/amici/_installation/swig/**,\
  python/sdist/amici/_installation/version.txt,\
  python/sdist/amici/exporters/sundials/templates/**,\
  python/sdist/amici/exporters/jax/jax.template.py,\
  python/sdist/amici/exporters/jax/nn.template.py,\
  python/tests/**,\
  **/*.html,\
  **/*.m,\
  **/sbml_test_models/**,\
  matlab/mtoc/**

sonar.sourceEncoding=UTF-8

sonar.cfamily.threads=2
sonar.cfamily.gcov.reportsPath=build
sonar.cpp.std=c++20

sonar.python.coverage.reportPaths=build/coverage_py.xml
sonar.python.version=3.12, 3.13, 3.14
