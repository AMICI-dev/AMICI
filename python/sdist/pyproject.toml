# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# https://setuptools.pypa.io/en/latest/userguide/index.html
[build-system]
# Keep in sync with [dependency-groups].build below
requires = [
    "setuptools>=77",
    "wheel",
    "numpy>=2.0",
    "cmake-build-extension==0.6.0",
    "scipy-openblas64==0.3.30.0.1; platform_system!='Darwin'",
    "swig",
]
build-backend = "setuptools.build_meta"

[project]
name = "amici"
dynamic = ["version"]
description = "Advanced multi-language Interface to CVODES and IDAS"
requires-python = ">=3.12"
dependencies = [
    "cmake-build-extension==0.6.0",
    "sympy>=1.12.1",
    "numpy>=1.26.2; python_version=='3.12'",
    "numpy; python_version>='3.13'",
    "python-libsbml",
    "pandas>=2.0.2",
    "sbmlmath>=0.4.0",
    "toposort",
    "setuptools>=48",
    "mpmath",
    "swig",
    "xarray>=2025.01.0",
]
license = "BSD-3-Clause"
authors = [
    {name = "Fabian Froehlich", email = "froehlichfab@gmail.com"},
    {name = "Daniel Weindl", email = "sci@danielweindl.de"},
    {name = "Jan Hasenauer"},
    {name = "AMICI contributors"},
]
maintainers = [
    {name = "Fabian Froehlich", email = "froehlichfab@gmail.com"},
    {name = "Daniel Weindl", email = "sci@danielweindl.de"},
]
readme = "README.md"
keywords =["differential equations", "simulation", "ode", "cvodes",
    "systems biology", "sensitivity analysis", "sbml", "pysb", "petab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
# Don't include any URLs here - they are not supported by PyPI:
#  HTTPError: 400 Bad Request from https://upload.pypi.org/legacy/
#  Invalid value for requires_dist. Error: Can't have direct dependency: ...
petab = ["petab>=0.7.0"]
pysb = ["pysb>=1.17.0"]
vis = [
    "matplotlib",
    "seaborn",
]
examples = [
    "jupyter",
    "scipy",
]
jax = [
    "jax>=0.7.2",
    "diffrax>=0.7.0",
    "jaxtyping>=0.2.34",
    "equinox>=0.13.2",
    "optimistix>=0.0.9",
]
sciml = [
    "h5py"
]

[dependency-groups]
# Packages required to build AMICI with --no-build-isolation
# Keep in sync with [build-system].requires above.
build = [
    "setuptools>=77",
    "wheel",
    "numpy>=2.0",
    "cmake-build-extension==0.6.0",
    "scipy-openblas64==0.3.30.0.1; platform_system!='Darwin'",
    "swig",
]

benchmark-models-petab = [
    "benchmark_models_petab @ git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master#subdirectory=src/python",
]
diffrax-dev = [
    # for events with direction; see https://github.com/patrick-kidger/diffrax/issues/654
    "diffrax @ git+https://github.com/patrick-kidger/diffrax@main",
]
fiddy = [
    # TODO: switch back to a PyPI release once the fiddy redesign ships
    "fiddy @ git+https://github.com/ICB-DCM/fiddy.git@main",
]
libpetab = [
    "petab @ git+https://github.com/petab-dev/libpetab-python.git@main",
]
# pinned: c84ce473133cd3979b55a725891fee45f248ddde (merge of PR #84,
# "update_api_page") dropped Layer/Node from petab_sciml's top-level
# exports, breaking amici/exporters/jax/nn.py's `from petab_sciml
# import Layer`. 3a712be6 is the last commit before that merge.
petab-sciml = [
    "petab_sciml @ git+https://github.com/petab-dev/petab_sciml.git@3a712be62accdda9506c1c1c088c3f8620a3e8a5",
]
petab-sciml-torch = [
    # torch pulls in its own bundled OpenMP, which can crash/deadlock
    # when loaded alongside AMICI's own OpenMP-linked native extension
    # (observed on macOS) - only install it where actually needed.
    "petab_sciml[torch] @ git+https://github.com/petab-dev/petab_sciml.git@3a712be62accdda9506c1c1c088c3f8620a3e8a5",
]
# TODO: PEtab test suite: v1 is intentionally pinned to a pre-v2 commit until
# proper PEtab v2 import support lands (https://github.com/AMICI-dev/AMICI/issues/2662).
petab-test-suite-v1 = [
    "petabtests @ git+https://github.com/PEtab-dev/petab_test_suite@10ffb050380933b60ac192962bf9550a9df65a9c",
]
petab-test-suite-v2 = [
    "petabtests @ git+https://github.com/PEtab-dev/petab_test_suite@main",
]
pysb-dev = [
    # master, not the PyPI release, to allow a more recent sympy
    # (https://github.com/pysb/pysb/commit/e83937cb8c74afc9b2fa96595b68464946745f33)
    "pysb @ git+https://github.com/pysb/pysb@master",
]
test = [
    "fiddy>=0.0.3",
    "h5py!=3.15",
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures!=16.0",
    "pytest-xdist",
    "coverage",
    "shyaml",
    "antimony>=2.13",
    "antimony!=2.14; platform_system=='Darwin' and platform_machine in 'x86_64h'",
    "scipy",
    "pooch",
    "beartype",
    "wheel",
]

[project.scripts]
# amici_import_petab.py is kept for backwards compatibility
amici_import_petab = "amici.importers.petab._cli.import_petab:_main"
"amici_import_petab.py" = "amici.importers.petab._cli.import_petab:_main"

[project.urls]
Homepage = "https://github.com/AMICI-dev/AMICI"
Documentation = "https://amici.readthedocs.io/en/latest/"
Repository = "https://github.com/AMICI-dev/AMICI.git"
"Bug Tracker" = "https://github.com/AMICI-dev/AMICI/issues"

# TODO: consider using setuptools_scm
#  https://github.com/AMICI-dev/AMICI/issues/3016

#[tool.setuptools_scm]
## https://setuptools-scm.readthedocs.io/en/latest/
#root = "../.."

[tool.setuptools.package-data]
amici = [
    "amici/include/amici/*",
    "src/*template*",
    "swig/*",
    "libs/*",
    "setup.py.template",
]

[tool.setuptools.exclude-package-data]
"*" = ["README.txt"]

[tool.setuptools.dynamic]
version = {attr = "amici.__version__"}

[tool.black]
line-length = 79

[tool.ruff]
line-length = 79
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["B028", "UP", "I"]
ignore = ["E402", "F403", "F405", "E741"]
