# see https://docs.codecov.com/docs/codecovyml-reference

fixes:
  # https://docs.codecov.com/docs/fixing-paths
  - "build/venv/lib/python[0-9.]+/site-packages/::python/"
  - "python/sdist/build/temp_amici/CMakeFiles/amici.dir/src/::src/"
  - "build/CMakeFiles/amici.dir/src/::src/"
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      # sbmlsuite/sbmlsuite-jax only run on pull_request when SBML-suite
      # paths change, relying on carryforward otherwise; keep them out of
      # the blocking check so a stale carryforward can't fail unrelated PRs.
      default:
        threshold: 0.15%
        flags:
          - python
          - cpp
          - cpp_python
          - petab
          - petab_sciml
          - petab_sciml_benchmarks
      sbmlsuite:
        flags:
          - sbmlsuite
          - sbmlsuite-jax
        informational: true
    patch:
      default:
        threshold: 0.15%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

ignore:
  - "tests/*"
  - "tests/**/*"
  - "build/tests/**"
  - "amici_models/**"

flags:
  python:
    carryforward: false
  cpp:
    carryforward: false
  petab:
    carryforward: false
  sbmlsuite:
    paths:
      - python/sdist/amici/importers/sbml/**
      - python/sdist/amici/exporters/sundials/de_export.py
    carryforward: true
  sbmlsuite-jax:
    paths:
      - python/sdist/amici/exporters/jax/**
      - python/sdist/amici/sim/jax/**
    carryforward: true
