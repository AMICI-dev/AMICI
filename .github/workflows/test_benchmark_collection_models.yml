name: Benchmark Collection
on:
  push:
    branches:
      - main
      - 'release*'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    - cron:  '48 4 * * *'

jobs:
  cpp:
    name: Benchmark Collection CPP

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14" ]
        extract_subexpressions: ["true", "false"]
    env:
      AMICI_EXTRACT_CSE: ${{ matrix.extract_subexpressions }}
    steps:
    - uses: dweindl/gha-runner-diagnostics@v1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/checkout@v7
      with:
        fetch-depth: 20

    - name: Install apt dependencies
      uses: ./.github/actions/install-apt-dependencies

    - run: echo "${HOME}/.local/bin/" >> $GITHUB_PATH

    # install AMICI
    - name: Create AMICI sdist
      run: pip3 install build && cd python/sdist && python3 -m build --sdist

    - name: Install AMICI sdist
      run: |
        pip3 install --user petab[vis] && \
        AMICI_PARALLEL_COMPILE="" pip3 install -v --user \
            $(ls -t python/sdist/dist/amici-*.tar.gz | head -1)[petab,test,vis,jax]

    # Diagnostic for https://github.com/AMICI-dev/AMICI/issues/3078: root
    # cause was NumPy's own runtime SIMD dispatch for transcendental ufuncs
    # (np.power/np.exp, used when unscaling log10/log-scaled PEtab
    # parameters) picking different, non-bit-identical kernels depending on
    # which instruction-set tiers are available on the runner. This can't be
    # inferred from generic hardware diagnostics (dweindl/gha-runner-diagnostics@v1,
    # which runs before Python/NumPy even exist) -- it has to be queried
    # from NumPy directly, after it's installed.
    - name: NumPy SIMD dispatch state (#3078)
      run: |
        python3 -c "
        import numpy as np
        try:
            from numpy._core import _multiarray_umath as mau
        except ImportError:
            from numpy.core import _multiarray_umath as mau
        print('numpy:', np.__version__)
        print('baseline:', mau.__cpu_baseline__)
        print('dispatch (compiled in):', mau.__cpu_dispatch__)
        print('features (active this run):', [k for k, v in mau.__cpu_features__.items() if v])
        "

    - name: Install test dependencies
      run: |
        python3 -m pip uninstall -y petab && python3 -m pip install git+https://github.com/petab-dev/libpetab-python.git@main \
        &&  python3 -m pip install -U sympy \
        &&  python3 -m pip install git+https://github.com/ICB-DCM/fiddy.git@redesign-fd-engine # TODO switch back to @main once the fiddy redesign is merged/released

    - name: Download benchmark collection
      run: |
        pip install -e 'git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master#subdirectory=src/python&egg=benchmark_models_petab'

    - name: Run tests
      env:
        AMICI_PARALLEL_COMPILE: ""
      run: |
        pytest tests/benchmark_models/test_petab_benchmark.py \
          --durations=10 \
          --cov=amici \
          --cov-report=xml:"coverage_py.xml" \
          --cov-append \

    - name: Codecov Python
      if: (github.event_name == 'pull_request' || github.repository_owner == 'AMICI-dev') && github.actor != 'dependabot[bot]'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage_py.xml
        flags: python
        fail_ci_if_error: true
        verbose: true

    # collect & upload results
    - name: Aggregate results
      run: |
          python3 tests/benchmark_models/evaluate_benchmark.py

    - uses: actions/upload-artifact@v7
      with:
        name: computation-times-${{ matrix.python-version }}-${{ matrix.extract_subexpressions }}
        path: |
          tests/benchmark_models/computation_times.csv
          tests/benchmark_models/computation_times.png

    - name: Upload model code
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: amici_models
        path: amici_models/

  jax:
    name: Benchmark Collection JAX
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14" ]
        extract_subexpressions: ["false"]
    env:
      AMICI_EXTRACT_CSE: ${{ matrix.extract_subexpressions }}
    steps:
    - uses: dweindl/gha-runner-diagnostics@v1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/checkout@v7
      with:
        fetch-depth: 20

    - name: Install apt dependencies
      uses: ./.github/actions/install-apt-dependencies

    - run: echo "${HOME}/.local/bin/" >> $GITHUB_PATH

    - name: Create AMICI sdist
      run: pip3 install build && cd python/sdist && python3 -m build --sdist

    - name: Install AMICI sdist
      run: |
        pip3 install --user petab[vis] && \
        pip3 install -v --user \
            $(ls -t python/sdist/dist/amici-*.tar.gz | head -1)[petab,test,vis,jax]

    - name: Install test dependencies
      run: |
        python3 -m pip uninstall -y petab && python3 -m pip install git+https://github.com/petab-dev/libpetab-python.git@1b8599dd1eb9bda74853255b4cc4baf75b7e4d63 \
        &&  python3 -m pip install -U sympy \
        &&  python3 -m pip install git+https://github.com/ICB-DCM/fiddy.git@amici100

    - run: pip uninstall -y diffrax && pip install git+https://github.com/patrick-kidger/diffrax@main # TODO FIXME https://github.com/patrick-kidger/diffrax/issues/654 + event dirs

    - name: Download benchmark collection
      run: |
        pip install -e 'git+https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git@master#subdirectory=src/python&egg=benchmark_models_petab'

    - name: Run JAX tests
      env:
        AMICI_PARALLEL_COMPILE: ""
      run: |
        pytest tests/benchmark_models/test_petab_benchmark_jax.py \
          --durations=10 \
          --cov=amici \
          --cov-report=xml:"coverage_py.xml" \
          --cov-append

    - name: Codecov Python
      if: (github.event_name == 'pull_request' || github.repository_owner == 'AMICI-dev') && github.actor != 'dependabot[bot]'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage_py.xml
        flags: python
        fail_ci_if_error: true
        verbose: true
