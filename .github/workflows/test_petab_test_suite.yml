name: PEtab
on:
  push:
    branches:
      - main
      - 'release*'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

jobs:
  petab_v1:
    name: PEtab Testsuite

    runs-on: ubuntu-latest

    env:
      ENABLE_GCOV_COVERAGE: TRUE

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: dweindl/gha-runner-diagnostics@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install apt dependencies
        uses: ./.github/actions/install-apt-dependencies

      # install dependencies
      - name: apt
        run: |
          sudo apt-get update \
            && sudo apt-get install -y python3-venv

      - name: Build BNGL
        run: scripts/buildBNGL.sh

      - run: |
          echo "${HOME}/.local/bin/" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/tests/performance/" >> $GITHUB_PATH
          echo "BNGPATH=${GITHUB_WORKSPACE}/ThirdParty/BioNetGen-2.9.2" >> $GITHUB_ENV

      # install AMICI
      - name: Install python package
        run: scripts/installAmiciSource.sh

      - name: Install test dependencies
        run: |
          source ./venv/bin/activate \
            && pip3 install --group python/sdist/pyproject.toml:test

      # retrieve test models
      - name: Download and install PEtab test suite
        # FIXME: Until we have proper PEtab v2 import
        #  (https://github.com/AMICI-dev/AMICI/issues/2662),
        #  we need the pseudo-v2-format commit pinned in
        #  python/sdist/pyproject.toml's petab-test-suite-v1 group
        #  instead of `main`.
        run: |
          source ./venv/bin/activate \
            && pip3 install --group python/sdist/pyproject.toml:petab-test-suite-v1

      - name: Install PEtab benchmark collection
        run: |
          source venv/bin/activate \
            && python -m pip install --group python/sdist/pyproject.toml:benchmark-models-petab

      - name: Install petab (dev)
        run: |
          source ./venv/bin/activate \
            && python3 -m pip uninstall -y petab \
            && python3 -m pip install --group python/sdist/pyproject.toml:libpetab \
            && python3 -m pip install --group python/sdist/pyproject.toml:pysb-dev \
            && python3 -m pip install sympy>=1.12.1


      - name: Run PEtab-related unit tests
        run: |
          source ./venv/bin/activate \
            && pytest --cov-report=xml:coverage.xml \
              --cov=./ python/tests/test_*petab*.py python/tests/petab_/

      # run test models
      - name: Run PEtab test suite
        run: |
          source ./venv/bin/activate \
          && AMICI_PARALLEL_COMPILE="" pytest -rxXs -v \
            --cov-report=xml:coverage.xml \
            --cov-append \
            --cov=amici \
            tests/petab_test_suite/test_petab_suite.py

      - name: Codecov
        if: (github.event_name == 'pull_request' || github.repository_owner == 'AMICI-dev') && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: petab
          fail_ci_if_error: true


  petab_v2:
    name: PEtab v2 Testsuite

    runs-on: ubuntu-latest

    env:
      ENABLE_GCOV_COVERAGE: TRUE

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: dweindl/gha-runner-diagnostics@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install apt dependencies
        uses: ./.github/actions/install-apt-dependencies

      # install dependencies
      - name: apt
        run: |
          sudo apt-get update \
            && sudo apt-get install -y python3-venv

      - name: Build BNGL
        run: scripts/buildBNGL.sh

      - run: |
          echo "${HOME}/.local/bin/" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/tests/performance/" >> $GITHUB_PATH
          echo "BNGPATH=${GITHUB_WORKSPACE}/ThirdParty/BioNetGen-2.9.2" >> $GITHUB_ENV

      # install AMICI
      - name: Install python package
        run: scripts/installAmiciSource.sh

      - name: Install test dependencies
        run: |
          source ./venv/bin/activate \
            && pip3 install --group python/sdist/pyproject.toml:test

      # retrieve test models
      - name: Download and install PEtab test suite
        run: |
          source ./venv/bin/activate \
            && pip3 install --group python/sdist/pyproject.toml:petab-test-suite-v2

# TODO: once there is a PEtab v2 benchmark collection
#      - name: Install PEtab benchmark collection
#        run: |
#          source venv/bin/activate \
#            && pip install --group python/sdist/pyproject.toml:benchmark-models-petab

      - name: Install petab (dev)
        run: |
          source ./venv/bin/activate \
            && python3 -m pip uninstall -y petab \
            && python3 -m pip install --group python/sdist/pyproject.toml:libpetab \
            && python3 -m pip install --group python/sdist/pyproject.toml:pysb-dev \
            && python3 -m pip install sympy>=1.12.1

      # run test models
      - name: Run PEtab test suite
        run: |
          source ./venv/bin/activate \
          && AMICI_PARALLEL_COMPILE="" pytest -rxXs -v \
            --cov-report=xml:coverage.xml \
            --cov-append \
            --cov=amici \
            tests/petab_test_suite/test_petab_v2_suite.py

      - name: Codecov
        if: (github.event_name == 'pull_request' || github.repository_owner == 'AMICI-dev') && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: petab
          fail_ci_if_error: true
